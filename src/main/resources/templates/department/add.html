<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{department.add} ?: 'Thêm mới phòng ban'">Thêm mới phòng ban</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/add-employee.css}">
    <link rel="stylesheet" th:href="@{/css/alert.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">
    <div class="page-header">
        <h1 class="page-title" th:text="#{department.add} ?: 'Thêm mới phòng ban'">Thêm mới phòng ban</h1>
        <a th:href="@{/department}" class="btn-back">
            &larr; Quay lại danh sách
        </a>
    </div>

    <div class="card card-add-employee">
        <h3 class="card-title">Nhập thông tin phòng ban</h3>
        <form th:action="@{/department}" th:object="${departmentRequest}" th:method="post" class="app-form" novalidate>
            <div th:replace="~{fragments/alert :: error-alert}"></div>

            <div class="form-group">
                <label for="departmentName" class="form-label">
                    Tên phòng ban <span class="required-mark">*</span>
                </label>
                <input id="departmentName" th:field="*{departmentName}" type="text" class="form-control"
                       th:errorclass="is-invalid" placeholder="Nhập tên phòng ban (ví dụ: Phòng Kế Toán, Phòng IT...)...">
                <span class="error-text" th:if="${#fields.hasErrors('departmentName')}" th:errors="*{departmentName}"></span>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Mô tả chức năng & nhiệm vụ</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4"
                          placeholder="Nhập mô tả chi tiết về chức năng, vai trò của phòng ban..."></textarea>
                <span class="error-text" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Tạo mới phòng ban</button>
                <a th:href="@{/department}" class="btn-cancel">Hủy bỏ</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

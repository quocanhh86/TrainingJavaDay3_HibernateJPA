<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{department.title} ?: 'Quản lý phòng ban'">Quản lý phòng ban</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/home-employee.css}">
    <link rel="stylesheet" th:href="@{/css/alert.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">
    <div class="page-header">
        <h1 class="page-title" th:text="#{department.title} ?: 'Danh sách phòng ban'">Danh sách phòng ban</h1>
        <a th:href="@{/department/add}" class="btn-add">
            <span class="btn-icon">+</span>
            <span th:text="#{department.add} ?: 'Thêm phòng ban'">Thêm phòng ban</span>
        </a>
    </div>

    <!-- Alert lỗi nghiệp vụ nếu có -->
    <div th:replace="~{fragments/alert :: error-alert}"></div>

    <div class="table-responsive">
        <table class="custom-table">
            <thead>
            <tr>
                <th style="width: 60px;">STT</th>
                <th>Mã phòng ban (ID)</th>
                <th th:text="#{department.name} ?: 'Tên phòng ban'">Tên phòng ban</th>
                <th th:text="#{department.description} ?: 'Mô tả'">Mô tả</th>
                <th style="width: 220px;" th:text="#{common.function} ?: 'Chức năng'">Chức năng</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dept, index : ${departments}">
                <td th:text="${index.count}"></td>
                <td th:text="${dept.id}" style="font-family: monospace; font-size: 0.85rem; color: #64748b;"></td>
                <td>
                    <strong th:text="${dept.departmentName}" style="color: #1e293b;"></strong>
                </td>
                <td th:text="${dept.description != null && !#strings.isEmpty(dept.description) ? dept.description : '-'}"></td>
                <td class="action-cell">
                    <div class="action-buttons">
                        <a th:href="@{/department/{id}(id=${dept.id})}" class="btn-detail" th:text="#{department.detail} ?: 'Chi tiết'">Chi tiết</a>
                        <a th:href="@{/department/edit/{id}(id=${dept.id})}" class="btn-edit" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">
                            Sửa
                        </a>
                        <form th:action="@{/department/remove/{id}(id=${dept.id})}" th:method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa phòng ban này?');">
                            <button type="submit" th:text="#{department.delete} ?: 'Xóa'" class="btn-delete"></button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${departments == null or departments.isEmpty()}">
                <td colspan="5" style="text-align: center; color: #64748b; padding: 28px;">Chưa có dữ liệu phòng ban nào.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Chi tiết phòng ban -->
    <div id="departmentModal" class="modal-backdrop" th:classappend="${department != null} ? 'active' : ''" th:if="${department != null}">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title" th:text="#{department.detail} ?: 'Chi tiết phòng ban'">Chi tiết phòng ban</h3>
                <a th:href="@{/department}" class="modal-close" style="text-decoration: none;" title="Đóng">&times;</a>
            </div>

            <div class="modal-body">
                <div class="modal-avatar-wrapper">
                    <div class="modal-avatar" style="display: inline-flex; align-items: center; justify-content: center; background: #e0e7ff; color: #4338ca; font-size: 2.2rem; font-weight: bold; width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 12px; box-shadow: var(--shadow-sm);">
                        <span>🏢</span>
                    </div>
                    <h4 class="modal-user-name" th:text="${department.departmentName}"></h4>
                </div>

                <div class="info-grid">
                    <div class="info-item full-width">
                        <div class="info-label">Mã định danh (ID)</div>
                        <div class="info-value info-value-id" th:text="${department.id}"></div>
                    </div>
                    <div class="info-item full-width">
                        <div class="info-label" th:text="#{department.name} ?: 'Tên phòng ban'">Tên phòng ban</div>
                        <div class="info-value" th:text="${department.departmentName}"></div>
                    </div>
                    <div class="info-item full-width">
                        <div class="info-label" th:text="#{department.description} ?: 'Mô tả'">Mô tả</div>
                        <div class="info-value" th:text="${department.description != null && !#strings.isEmpty(department.description) ? department.description : 'Chưa có thông tin mô tả'}"></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <a th:href="@{/department}" class="btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center;">Đóng</a>
                <a th:href="@{/department/edit/{id}(id=${department.id})}" class="btn-edit-mode" style="text-decoration: none; display: inline-flex; align-items: center;">Chỉnh sửa thông tin</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/home-department.js}"></script>

</body>
</html>

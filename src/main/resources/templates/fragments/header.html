<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Fragment Header -->
<header th:fragment="header" class="site-header">
    <div class="header-container">
        <div class="logo">
            <a th:href="@{/}">
                <span class="logo-icon">🏢</span>
                <span class="logo-text">EMS <strong>Portal</strong></span>
            </a>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a th:href="@{/}" class="nav-link">Trang chủ</a></li>
                <li><a th:href="@{/employee}" class="nav-link">Nhân viên</a></li>
                <li><a th:href="@{/department}" class="nav-link">Phòng ban</a></li>
                <li><a th:href="@{/project}" class="nav-link">Dự án</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <div sec:authorize="!isAuthenticated()" style="display: flex; align-items: center; gap: 0.6rem;">
                <a th:href="@{/login}" class="btn-action">Đăng nhập</a>
                <a th:href="@{/register}" class="btn-secondary" style="text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px;">Đăng ký</a>
            </div>
            <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center; gap: 0.75rem;">
                <span style="font-size: 0.875rem; color: #475569; font-weight: 500;" sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                    <button type="submit" class="btn-delete" style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; cursor: pointer; padding: 0.4rem 0.8rem; border-radius: 6px;">Đăng xuất</button>
                </form>
            </div>
        </div>
    </div>
</header>

</body>
</html>

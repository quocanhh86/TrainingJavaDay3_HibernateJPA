<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.page_title}"></title>
    <link rel="stylesheet" th:href="@{/css/fragments/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth-error.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div>
                <span class="admin-badge" th:text="#{register.badge}"></span>
            </div>
            <div class="auth-logo-badge">👤+</div>
            <h1 class="auth-title" th:text="#{register.title}"></h1>
            <p class="auth-subtitle" th:text="#{register.subtitle}"></p>
        </div>

        <!-- Thông báo lỗi trùng lặp hoặc lỗi nghiệp vụ -->
        <div th:if="${businessError != null}" class="auth-alert alert-error">
            <span class="auth-alert-icon">⚠️</span>
            <div th:text="${businessError}"></div>
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="auth-form">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="auth-form-group">
                    <label for="firstName" class="auth-label" th:text="#{register.first_name}"></label>
                    <div class="auth-input-wrapper">
                        <input type="text"
                               id="firstName"
                               th:field="*{firstName}"
                               class="auth-input"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"
                               th:placeholder="#{register.first_name.placeholder}"
                               required
                               autofocus>
                    </div>
                    <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="field-error"></div>
                </div>

                <div class="auth-form-group">
                    <label for="lastName" class="auth-label" th:text="#{register.last_name}"></label>
                    <div class="auth-input-wrapper">
                        <input type="text"
                               id="lastName"
                               th:field="*{lastName}"
                               class="auth-input"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"
                               th:placeholder="#{register.last_name.placeholder}"
                               required>
                    </div>
                    <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="field-error"></div>
                </div>
            </div>

            <div class="auth-form-group">
                <label for="email" class="auth-label" th:text="#{register.email}"></label>
                <div class="auth-input-wrapper">
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="auth-input"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           th:placeholder="#{register.email.placeholder}"
                           required>
                </div>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></div>
            </div>

            <div class="auth-form-group">
                <label for="password" class="auth-label" th:text="#{register.password}"></label>
                <div class="auth-input-wrapper">
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="auth-input"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           th:placeholder="#{register.password.placeholder}"
                           required>
                </div>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></div>
            </div>

            <button type="submit" class="btn-auth-submit" th:text="#{register.btn.submit}"></button>
        </form>

        <div class="auth-footer">
            <p>
                <a th:href="@{/login}" th:text="#{register.link.login}"></a> | 
                <a th:href="@{/}" th:text="#{register.link.home}"></a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
